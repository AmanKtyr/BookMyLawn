{% extends 'superadmin/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-10">
      <div class="row align-items-center my-4">
        <div class="col">
          <h2 class="h3 mb-0 page-title">Add New Vendor</h2>
        </div>
      </div>
      <form action="{% url 'superadmin_vendor_add' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <hr class="my-4">
        <h5 class="mb-2 mt-4">Vendor Details</h5>
        <p class="text-muted">Information about the new vendor.</p>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="name">Business Name</label>
            <input type="text" id="name" name="name" class="form-control" required>
          </div>
          <div class="form-group col-md-6">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control" required>
              <option value="">Choose category...</option>
              {% for category in categories %}
              <option value="{{ category.id }}">{{ category.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="location">Location / City</label>
            <input type="text" id="location" name="location" class="form-control" required>
          </div>
          <div class="form-group col-md-6">
            <label for="price_starting">Starting Price</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">₹</span>
              </div>
              <input type="number" id="price_starting" name="price_starting" class="form-control" value="0.00" step="0.01">
            </div>
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="description">Description</label>
          <textarea class="form-control" id="description" name="description" rows="4"></textarea>
        </div>
        <div class="form-group mb-3">
          <label for="image">Cover Image</label>
          <div class="custom-file">
            <input type="file" class="custom-file-input" id="image" name="image" accept="image/*">
            <label class="custom-file-label" for="image">Choose file...</label>
          </div>
        </div>
        <div class="form-row mt-4">
          <div class="form-group col-md-6">
            <div class="custom-control custom-switch">
              <input type="checkbox" class="custom-control-input" id="is_verified" name="is_verified">
              <label class="custom-control-label" for="is_verified">Verified Vendor</label>
            </div>
          </div>
          <div class="form-group col-md-6">
            <div class="custom-control custom-switch">
              <input type="checkbox" class="custom-control-input" id="is_premium" name="is_premium">
              <label class="custom-control-label" for="is_premium">Premium Placement</label>
            </div>
          </div>
        </div>
        <hr class="my-4">
        <div class="form-row">
          <div class="col-md-12 text-right">
            <a href="{% url 'superadmin_vendors' %}" class="btn btn-secondary mr-2">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Vendor</button>
          </div>
        </div>
      </form>
    </div> <!-- .col-12 -->
  </div> <!-- .row -->
</div> <!-- .container-fluid -->
{% endblock %}
