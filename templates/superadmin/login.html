{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superadmin Login | BookMyLawn</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'website/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'website/css/font-awesome.min.css' %}">
    <style>
        :root {
            --primary-color: #e72e77;
            --secondary-color: #111;
            --text-color: #333;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #111 0%, #333 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h2 {
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }

        .login-card .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-card .logo-area i {
            font-size: 50px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 15px;
            top: 15px;
            color: #888;
        }

        .form-control {
            height: 50px;
            padding-left: 45px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(231, 46, 119, 0.15);
        }

        .btn-login {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-login:hover {
            background: #c2185b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 46, 119, 0.4);
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }

        .back-home a:hover {
            color: var(--primary-color);
        }

        .alert {
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo-area">
            <i class="fa fa-shield"></i>
        </div>
        <h2>Superadmin Login</h2>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <i class="fa fa-user"></i>
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>
            <div class="form-group">
                <i class="fa fa-lock"></i>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">Login to Dashboard</button>
        </form>

        <div class="back-home">
            <a href="/"><i class="fa fa-arrow-left"></i> Back to Website</a>
        </div>
    </div>
</body>

</html>
