{% extends 'website/base.html' %}
{% load static %}

{% block content %}
<style>
    .login-section {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fa;
        padding: 50px 0;
    }
    .login-container {
        display: flex;
        width: 1000px;
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 15px 50px rgba(0,0,0,0.1);
    }
    .login-image {
        flex: 1;
        background-size: cover;
        background-position: center;
        position: relative;
    }
    .login-image::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.4);
    }
    .login-form-side {
        flex: 1;
        padding: 60px;
    }
    .login-form-side h3 {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-size: 32px;
        margin-bottom: 10px;
    }
    .login-form-side p {
        color: #666;
        margin-bottom: 30px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 8px;
        color: #333;
    }
    .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        transition: 0.3s;
    }
    .form-group input:focus {
        border-color: #e72e77;
        box-shadow: 0 0 0 4px rgba(231, 46, 119, 0.1);
        outline: none;
    }
    .btn-login {
        background: #e72e77;
        color: white;
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }
    .btn-login:hover {
        background: #c2185b;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(231, 46, 119, 0.3);
    }
    
    @media (max-width: 991px) {
        .login-image { display: none; }
        .login-container { width: 100%; max-width: 500px; }
    }
</style>

<div class="login-section">
    <div class="login-container">
        <div class="login-image" style="background-image: url('{% static 'website/img/banner/banner-2.jpg' %}?v=2');">
            <div style="position: absolute; bottom: 40px; left: 40px; color: white;">
                <h2 style="font-family: 'Playfair Display', serif; font-weight: 700; color: white;">Join BookMyLawn</h2>
                <p style="color: white; opacity: 0.9;">Start planning your magical celebration today.</p>
            </div>
        </div>
        <div class="login-form-side">
            <h3>Create Account</h3>
            <p>Sign up to start booking the best wedding venues and vendors.</p>
            
            <form action="#">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>I am a:</label>
                    <select class="form-control" style="width: 100%; border-radius: 8px; height: 45px; border: 1px solid #ddd; padding-left: 10px;">
                        <option value="user">Couple / Individual</option>
                        <option value="vendor">Wedding Vendor / Venue Owner</option>
                    </select>
                </div>
                <button type="submit" class="btn-login">Create Account</button>
            </form>

            <p style="margin-top: 30px; text-align: center; font-size: 14px;">
                Already have an account? <a href="{% url 'login' %}" style="color: #e72e77; font-weight: 600; text-decoration: none;">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
